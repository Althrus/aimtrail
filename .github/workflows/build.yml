name: Build AimTrail.exe

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Versi di kode harus sama dengan tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: python
        run: |
          import os, re, sys
          tag = os.environ['GITHUB_REF_NAME'].lstrip('v')
          ver = re.search(r'VERSION = "([^"]+)"', open('server.py', encoding='utf-8').read()).group(1)
          if ver != tag:
              sys.exit(f'VERSION di server.py ({ver}) berbeda dari tag ({tag}). Jalankan: python tools/release.py {tag}')
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Make icon
        run: python icon.py
      - name: Build exe
        run: pyinstaller --noconfirm --clean aimtrail.spec
      - name: Checksum SHA-256 (dipakai pembaruan otomatis)
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/AimTrail.exe -Algorithm SHA256).Hash.ToLower()
          "$h  AimTrail.exe" | Out-File -Encoding ascii dist/AimTrail.exe.sha256
          Get-Content dist/AimTrail.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: AimTrail-windows
          path: |
            dist/AimTrail.exe
            dist/AimTrail.exe.sha256
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AimTrail.exe
            dist/AimTrail.exe.sha256
          generate_release_notes: true
